<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Mahmoud Elmansari</title>
<meta name="description" content="Get in touch with Mahmoud Elmansari — Unity developer, games, graphics and interactive experiences.">

<meta property="og:title" content="Contact — Mahmoud Elmansari">
<meta property="og:description" content="Let's talk.">
<meta property="og:type" content="website">

<link rel="icon" href="home-assets/star.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Caveat:wght@600;700&family=Permanent+Marker&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/contact.css">
</head>

<body class="page-contact">

<!-- =================================================================
     BACKGROUND — the supplied artwork, covering the whole window
     ================================================================= -->
<div class="bg" aria-hidden="true">
  <img class="bg-art" src="contact-assets/background.png" alt="">
</div>

<!-- =================================================================
     VIEWPORT > FRAME — composed on the 1600 x 900 canvas
     ================================================================= -->
<div class="viewport">
<div class="frame">

  <main class="stage">

    <!-- ---------- the flip card ---------- -->
    <div class="card" id="card">
      <div class="card-inner">

        <!-- side A: the face -->
        <div class="card-face card-face--front">
          <img class="card-plate" src="contact-assets/Card_Front.png" alt="">
          <img class="card-portrait" src="contact-assets/Card_Back_Face.png"
               alt="Stylised portrait of Mahmoud Elmansari">
        </div>

        <!-- side B: the details -->
        <div class="card-face card-face--back">
          <img class="card-plate" src="contact-assets/Card_Front.png" alt="">

          <ul class="details">
            <li>
              <a href="mailto:mahmoudelmansari@gmail.com">
                <img src="contact-assets/Email_Icon.png" alt="" class="details-icon">
                <span>mahmoudelmansari@gmail.com</span>
              </a>
            </li>
            <li>
              <a href="https://www.instagram.com/mahmoudlmansari/"
                 target="_blank" rel="noopener">
                <img src="contact-assets/instagram_Icon.png" alt="" class="details-icon">
                <span>Instagram / Mahmoud Elmansari</span>
              </a>
            </li>
            <li>
              <a href="https://www.linkedin.com/in/mahmoud-el-mansari/"
                 target="_blank" rel="noopener">
                <img src="contact-assets/Linkedin_Icon.png" alt="" class="details-icon">
                <span>LinkedIn / Mahmoud Elmansari</span>
              </a>
            </li>
            <li>
              <a href="https://github.com/mahmoudelmansari"
                 target="_blank" rel="noopener">
                <img src="contact-assets/Github_Icon.png" alt="" class="details-icon">
                <span>GitHub / mahmoudelmansari</span>
              </a>
            </li>
          </ul>
        </div>

      </div>
    </div>

    <!-- ---------- title, sits over the card ---------- -->
    <img class="title" src="contact-assets/Contact_Title.png"
         alt="Contact — let's talk">

    <!-- ---------- flip control ---------- -->
    <button class="flip" type="button"
            aria-controls="card" aria-pressed="false"
            aria-label="Flip the card to see contact details">
      <span>Flip</span>
    </button>

    <!-- ---------- marginalia ---------- -->
    <p class="note note--left" aria-hidden="true">
      <span class="note-text">Let's<br>Create<br>Together.
        <img class="note-dash" src="contact-assets/dash_stroke.png" alt="">
      </span>
      <img class="note-star" src="contact-assets/star.png" alt="">
    </p>
    <p class="note note--right" aria-hidden="true">
      See<br>You<br>Around.
      <img class="note-dash" src="contact-assets/dash_stroke.png" alt="">
    </p>

    <!-- ---------- onward navigation ---------- -->
    <nav class="elsewhere" aria-label="Continue to">
      <ul>
        <li><a class="nav-btn" href="about.html"><span>About</span></a></li>
        <li><a class="nav-btn" href="works.html"><span>Works</span></a></li>
        <li><a class="nav-btn" href="works.html#art"><span>Art</span></a></li>
      </ul>
    </nav>

  </main>

</div>
</div>

<!-- home, outside the frame — a transformed ancestor would make
     position:fixed resolve against the frame instead of the window -->
<a class="home-link" href="index.html" aria-label="Back to home">
  <img src="general-assets/House_Icon_Persona.png" alt="">
</a>

<script src="js/main.js"></script>
</body>
</html>
